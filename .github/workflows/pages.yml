# The website moved to https://kokon.app (Cloudflare, see wrangler.jsonc). This keeps the old
# address https://gabrielelozupone.github.io/kokon/... working by sending every page there.
name: Redirect old site address

on:
  push:
    branches: [master]
    paths: [".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Build redirect pages
        run: |
          page() {
            mkdir -p "out/$1"
            cat > "out/$1/index.html" <<HTML
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <title>Kokon moved to kokon.app</title>
          <link rel="canonical" href="https://kokon.app/$1">
          <meta http-equiv="refresh" content="0; url=https://kokon.app/$1">
          <meta name="robots" content="noindex">
          </head><body><p>Kokon moved to <a href="https://kokon.app/$1">kokon.app</a>.</p></body></html>
          HTML
          }
          page ""
          page "qwen-image-2-1-local/"
          page "mcp-image-generation/"
          cat > out/404.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex">
          <script>location.replace("https://kokon.app" + location.pathname.replace(/^\/kokon/, "") + location.search + location.hash);</script>
          </head><body><p>Kokon moved to <a href="https://kokon.app/">kokon.app</a>.</p></body></html>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
