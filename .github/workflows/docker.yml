name: Docker image

# Builds docker/Dockerfile and publishes it as ghcr.io/gabrielelozupone/kokon on every release:
# tags 0.11.0 and 0.11, plus latest for a release that is not a pre-release. The image holds no
# models; Kokon's setup downloads them into the data volume. Guide: docs/docker.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build again, e.g. v0.11.0"
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gabrielelozupone/kokon
          # latest=auto: semver tags without a pre-release part also get "latest".
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name || inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name || inputs.tag }}
          labels: |
            org.opencontainers.image.title=Kokon
            org.opencontainers.image.description=Kokon for NVIDIA GPUs (CUDA), used from a browser
            org.opencontainers.image.licenses=AGPL-3.0-only
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
